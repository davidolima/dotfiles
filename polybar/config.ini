[colors]
background = #00282c34
background-alt = #33282a36
foreground = #abb2bf
primary = #61afef
secondary = #5c6370
alert = #d19a66
disabled = #e06c75
white = #f0f0f0
green = #98c379
purple = #c678dd
light-blue = #0A99bbff
red = #e06c75
yellow = #E5C17C

[bar/dol]
fixed-center = true
width = 100%
height = 20pt
radius = 6

dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

border-size = 3pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = ""
separator-foreground = ${colors.foreground}

font-0 = SauceCodePro Nerd Font:size=10;3
font-1 = SauceCodePro Nerd Font:size=12:weight=bold;3

modules-left = xworkspaces tray spotify
modules-center = date
modules-right = backlight temperature memory cpu wireless-network wired-network pulseaudio battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-name=i3
; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true

[module/backlight]
type = internal/backlight
label =  "%percentage%%"
label-foreground = ${colors.foreground}
format-foreground = ${colors.primary}
format = <ramp> <label>
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 10

ramp-0 = %{A1}󰃚
ramp-1 = %{A1}󰃝
ramp-2 = %{A1}󰃞
ramp-3 = %{A1}󰃟
ramp-4 = %{A1}󰃠

[module/menu-apps]
type = custom/menu
expand-right = true
menu-0-0 = Browsers
menu-0-0-exec = #menu-apps.open.1

[module/tray]
type=internal/tray

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.white}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 30

[module/pulseaudio]
type = internal/pulseaudio

click-right = exec pavucontrol &
scroll-up = pulseaudio-control --volume-max 130 up
scroll-down = pulseaudio-control --volume-max 130 down

format-volume-prefix = "󱄠 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "󰖁"
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{A1:conky:}󰍛 "
format-prefix-foreground = ${colors.primary}
label = "%percentage_used:2%%%{A}"

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/powermenu]
type = custom/menu
format-foreground = ${colors.foreground}

expand-center = true

label-open = " "
label-open-font = 4
label-close = ""
;label-separator = " | "
;label-separator-foreground = ${colors.foreground}

; shutdown
menu-0-0 = "%{T4} %{T1}| "
menu-0-0-exec = "systemctl poweroff"
menu-0-0-foreground = ${colors.red}
; reboot
menu-0-1 = "%{T4} %{T-}| "
menu-0-1-exec = systemctl reboot
menu-0-1-foreground = ${colors.yellow}
; back
menu-0-2 = "%{T4}<< "
menu-0-2-font = 0
menu-0-2-foreground = ${colors.green}

[module/wired-network]
type = internal/network
interface = enp4s0

label-connected = %upspeed% %downspeed%
label-connected-foreground = ${colors.foreground}
format-connected-foreground = ${colors.primary}
format-connected = %{A1:alacritty -e nmtui &:}󰈁 %{A} <label-connected>

label-disconnected-foreground = ${colors.disabled}
format-disconnected-foreground = ${colors.primary}
format-disconnected = %{A1:alacritty -e nmtui &:}󰈂%{A}

[module/wireless-network]
type = internal/network
interface = wlp0s20f3
label-connected = %upspeed% %downspeed%
label-connected-foreground = ${colors.foreground}
format-connected-foreground = ${colors.primary}
format-connected = %{A1:alacritty -e nmtui &:}<ramp-signal> %{A} <label-connected>

label-disconnected-foreground = ${colors.disabled}
format-disconnected-foreground = ${colors.primary}
format-disconnected = %{A1:alacritty -e nmtui &:}󰤮%{A}

format-packetloss = <ramp-signal> <animation-packetloss> <label-connected>
animation-packetloss-0 = 
animation-packetloss-0-foreground = #ffa64c
animation-packetloss-1 = 
animation-packetloss-1-foreground = #000000

; ramp-signal-0 = %{T3}%{F#d00b0f}󰤯
; ramp-signal-1 = %{T3}%{F#d00b0f}󰤟
; ramp-signal-2 = %{T3}%{F#F0C674}󰤢
; ramp-signal-3 = %{T3}%{F#F0C674}󰤥
; ramp-signal-4 = %{T3}%{F#98c379}󰤨

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨


[module/date]
type = internal/date
interval = 1
date =  %a, %d/%m - %H:%M 
date-alt = %H:%M

label = %{T2}%date%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 95
low-at = 20

poll-interval = 5

label-discharging = "%{T1}%percentage%%"
label-charging = "%{T1}%percentage%%"
label-low = "%{T1}%percentage%%"
label-full = "Full"

label-discharging-foreground = ${colors.foreground}
label-charging-foreground = ${colors.foreground}
label-low-foreground = ${colors.red}
label-full-foreground = ${colors.green}

format-discharging = "<ramp-capacity>  <label-discharging>"
format-discharging-foreground = ${colors.primary}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 

format-charging = "%{F#98c379}<ramp-capacity> 󱐋 <label-charging>"
format-charging-foreground = ${colors.primary}

animation-charging-0 = 󱐋
animation-charging-1 =

format-low = "<ramp-capacity> <animation-low><label-low>"
format-low-foreground = ${colors.red}

format-full = "%{F#98c379}  <label-full>"
format-full-foreground = ${colors.primary}

animation-low-0 = !
animation-low-1 = " "
animation-low-framerate = 500

[module/temperature]
type = internal/temperature

format = <ramp> <label>
label =  %temperature-c%
label-foreground = ${colors.foreground}
format-foreground = ${colors.primary}

base-temperature = 20
warn-temperature = 70
label-warn = %temperature-c%!
label-warn-foreground = ${colors.alert}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 

[module/spotify]
type = custom/script
interval = 1
format-prefix = " "
format = <label>
exec = python3 ${HOME}/.config/polybar/spotify.py -f '{song} - {artist}'
label-foreground = ${colors.foreground}
format-foreground = ${colors.green}
format-underline = ${colors.green}

;[module/bluetooth]
;type = custom/script
;exec = ~/.config/polybar/bluetooth.sh
;interval = 2
;click-left = exec blueberry
;click-right = exec ~/.config/polybar/toggle_bluetooth.sh
;format-foreground = ${colors.foreground}


[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
